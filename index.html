<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <!--
      Best-effort CSP. GitHub Pages can't send a real Content-Security-Policy
      HTTP header (static host, fixed headers), so this <meta> tag is a
      partial substitute — notably, frame-ancestors and report-uri are
      ignored by browsers when set via <meta> and would need a real header
      to take effect (e.g. by moving to a host that supports one).
      style-src needs 'unsafe-inline' for Vue's dynamic :style bindings
      (filament color swatches) — there's no static hash/nonce for those.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      font-src 'self';
      connect-src 'self' %VITE_SUPABASE_URL%;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    ">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bambu Filament Guide</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
